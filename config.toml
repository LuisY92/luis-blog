baseURL = "https://luisy92.win"
title = "轶群说"
languageCode = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
# 日期按北京时间显示；旧配置按 UTC 渲染，页面日期会比实际早一天
timeZone = "Asia/Shanghai"
theme = "yiqun"
enableRobotsTXT = true

[taxonomies]
  series = "series"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services.rss]
  limit = 20

[markup.goldmark.renderer]
  unsafe = true

[author]
  name = "Luis"

[params]
  description = "我是轶群，这里是我的自留地，记录一个普通人的变化和成长。如其所是，此时此刻。"
  # 首页自我介绍里手写的两行，下面那行统计由模板根据文章数据生成
  lead = "我是轶群，这里是我的自留地，记录一个普通人的变化和成长。"
  motto = "如其所是，此时此刻。"
  city = "苏州"
  since = 2022
  wechat = "轶群说"
  ogImage = "/images/brand/og-cover.png"
  qr = "/images/brand/wechat-qr.jpg"
