  {{- else }}
  <a class="brand" href="/">{{ site.Title }}</a>
  {{- end }}
  <nav><a href="/series/">栏目</a><a href="/archive/">时间轴</a><a href="/about/">关于</a><a href="/index.xml">RSS</a><button class="mode" type="button" hidden aria-label="切换深色和浅色模式"></button></nav>
</header>
